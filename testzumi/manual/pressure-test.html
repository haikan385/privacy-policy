<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耐圧試験 | テストズミ！</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="wrap"><a class="brand" href="./">← Web版取扱説明書</a></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">試験記録</div><h1>耐圧試験を作成・開始する</h1><p>試験の種類、圧力、保持時間を設定して記録します。</p></div></section><section class="section"><div class="wrap"><div class="card step"><h3>1. 試験条件を入力</h3><p>試験種類、圧力、保持時間を設定します。開始前に入力値を確認してください。</p></div><div class="card step"><h3>2. 開始写真を残す</h3><p>ゲージなど、開始時の状態が分かる写真を記録します。</p></div><div class="card step"><h3>3. 試験を開始</h3><p>試験中は経過時間と開始時の条件を確認できます。</p></div><div class="notice gap"><strong>入力を間違えたとき：</strong>進行中の試験では「やり直し」を使います。</div></div></section></main></body></html>
