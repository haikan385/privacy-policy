<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まずはこれだけ | テストズミ！</title><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="site-header"><div class="wrap"><a class="brand" href="./">← Web版取扱説明書</a></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">はじめて使う方へ</div><h1>まずはこれだけ</h1><p>現場を作ってからPDFを出すまで、基本は6つの手順です。</p></div></section><section class="section"><div class="wrap"><div class="card step"><h3>1. 現場を作る</h3><p>現場名を入力し、必要なら現場写真も登録します。</p></div><div class="card step"><h3>2. 試験箇所を作る</h3><p>部屋、階、共用部など、試験する場所を登録します。</p></div><div class="card step"><h3>3. 試験を作る</h3><p>試験の種類、圧力、保持時間を設定します。</p></div><div class="card step"><h3>4. 開始写真 → 試験開始</h3><p>ゲージなどを撮影し、内容を確認して開始します。</p></div><div class="card step"><h3>5. 終了写真 → 完了</h3><p>保持後の状態を写真で残します。</p></div><div class="card step"><h3>6. PDF出力</h3><p>帳票を作り、iPhoneの共有画面から保存・送信・印刷などへ進みます。</p></div></div></section></main></body></html>
